[package]
name = "git-lineage"
version = "0.2.0"
edition = "2021"
description = "Transitively reduced history-inclusion graph for Git branch refs"
authors = ["bronekot"]
license = "MIT"
readme = "README.md"
documentation = "https://github.com/bronekot/git-lineage#readme"
homepage = "https://github.com/bronekot/git-lineage"
repository = "https://github.com/bronekot/git-lineage"
rust-version = "1.85"
keywords = ["git", "branches", "cli", "visualization", "workflow"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/README.ru.md",
    "/CHANGELOG.md",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/RELEASING.md",
    "/SECURITY.md",
    "/LICENSE",
]

[[bin]]
name = "git-lineage"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
