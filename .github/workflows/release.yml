name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          version=$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo version ${version}" >&2
            exit 1
          }
      - name: Create draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --generate-notes \
              --title "git-lineage ${GITHUB_REF_NAME#v}"

  windows:
    name: Windows x86_64
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build archive
        shell: pwsh
        run: |
          $target = "x86_64-pc-windows-msvc"
          $name = "git-lineage-$target"
          cargo build --release --locked --target $target
          New-Item -ItemType Directory -Path $name
          Copy-Item "target/$target/release/git-lineage.exe", README.md, README.ru.md, LICENSE -Destination $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - name: Upload archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:GITHUB_REF_NAME git-lineage-x86_64-pc-windows-msvc.zip --clobber

  linux:
    name: Linux x86_64 musl
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build archive
        shell: bash
        run: |
          target=x86_64-unknown-linux-musl
          name=git-lineage-$target
          cargo build --release --locked --target "$target"
          mkdir "$name"
          cp "target/$target/release/git-lineage" README.md README.ru.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
      - name: Upload archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" git-lineage-x86_64-unknown-linux-musl.tar.gz --clobber

  macos:
    name: macOS Apple Silicon
    needs: create-release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build archive
        shell: bash
        run: |
          target=aarch64-apple-darwin
          name=git-lineage-$target
          cargo build --release --locked --target "$target"
          mkdir "$name"
          cp "target/$target/release/git-lineage" README.md README.ru.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
      - name: Upload archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" git-lineage-aarch64-apple-darwin.tar.gz --clobber

  publish-release:
    name: Publish GitHub release
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
