name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials, private URLs, and sensitive repository names before submitting.
  - type: input
    id: version
    attributes:
      label: git-lineage version
      placeholder: Output of `git lineage --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Git 2.x, PowerShell 7
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and sanitized configuration
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized stdout and stderr.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Explain the relevant branch and tracking relationships.
    validations:
      required: true
